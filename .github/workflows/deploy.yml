name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.IAMHASSAN1995 }}" --password-stdin

    - name: Build Image
      run: docker build -t yourdockerhubusername/web-test:latest .

    - name: Push Image
      run: docker push yourdockerhubusername/web-test:latest

    - name: Deploy
      run: kubectl apply -f deployment.yaml

